# Single source of settings for every notebook / script.
# Override per environment with a second YAML (deep-merged) or with
#   load_config("configs/default.yaml", overrides={"paths": {"root": "..."}}).
# Relative paths under `paths` are resolved against `paths.root`.

project:
  name: arabic_summ
  seed: 42

paths:
  root: /content/drive/MyDrive/arabic_summ   # Google Drive root for all artifacts
  raw: data/raw
  processed: data/processed
  benchmark: data/benchmark
  logs: logs
  markers: state            # step-completion markers (resumability)
  models: models            # fine-tuning runs and exported models (03)
  scratch: /content/scratch/arabic_summ   # fast local disk for re-creatable temp files

# ---------------------------------------------------------------- data (01)
xlsum:
  repo_id: csebuetnlp/xlsum
  # Pinned dataset commit (HF dataset repo). Recorded in data_manifest.json.
  revision: 30fece425f9a3866e04321773ca7a80056d55ca6
  archive: data/arabic_XLSum_v2.0.tar.bz2
  # SHA256 of the archive as published by the Hub (LFS etag). Download is rejected on mismatch.
  archive_sha256: 371a07df0f89d83c2ca330f56ba33cc4cd39c1b532d6886910c97dfbacfdf2b7
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  # Official split sizes stated in the proposal; a mismatch is reported (not fatal).
  expected_counts: {train: 37519, validation: 4689, test: 4689}

dedup:
  shingle_size: 5            # word n-gram size for near-duplicate shingles
  num_perm: 128              # MinHash permutations
  near_dup_threshold: 0.8    # estimated Jaccard >= this => near-duplicate
  # Official validation/test splits are never modified (comparability with published
  # results); duplicates there are only reported. Train copies of eval docs are removed.
  modify_eval_splits: false
  min_text_words: 20         # drop rows with (near-)empty article text
  min_summary_words: 3

# ------------------------------------------------------- internal benchmark
benchmark:
  domains: [news, org_report]
  min_per_domain: 120        # >= 240 total, balanced
  input_min_words: 300
  input_max_words: 1000
  # News half is drawn from XL-Sum *test* articles (never trained on), stratified by
  # length so both latency bands (300-700, 700-1000) are covered. Candidates are
  # oversampled so annotators can reject unsuitable texts.
  news_candidates: 150
  length_bins: [300, 500, 700, 1001]
  # Reference-summary length rules (see docs/reference_guideline.md).
  reference_target_ratio: 0.20
  reference_ratio_tolerance: 0.05   # guideline asks for 15-25 % ...
  reference_hard_min_ratio: 0.10    # ... validation hard-fails outside 10-30 %
  reference_hard_max_ratio: 0.30
  reference_min_words: 30
  reference_max_words: 300
  min_key_points: 3
  guideline_version: "1.0"
  min_arabic_ratio: 0.6      # share of letters that must be Arabic script
  # Automatic item selection (documented, seeded, idempotent; see benchmark.auto_select).
  auto_select:
    rule_version: "1"
    per_domain: 120
    min_arabic_ratio: 0.9
    max_digit_token_share: 0.15   # rejects table/number dumps
  # Organizational-report URL list (committed; texts are fetched in Colab, never committed).
  org_sources_csv: benchmark_sources/org_reports.csv

# ------------------------------------------------------- normalization (02)
normalization:
  # Light policy applied to model input/output: must keep text well-spelled.
  model:
    unicode_form: NFKC         # folds Arabic presentation forms / lam-alef ligatures
    remove_tatweel: true
    diacritics: strip          # strip | keep
    fold_persian_variants: true # ی ک -> ي ك (keyboard-encoding variants, not spelling)
    unify_alef: false          # أ إ آ ٱ -> ا
    alef_maqsura_to_yeh: false # ى -> ي
    teh_marbuta_to_heh: false  # ة -> ه
    digits: keep               # keep | ascii   (Arabic-Indic / Persian digits)
    remove_control_chars: true # Cc (except \n \t), Cf (bidi marks, ZWJ/ZWNJ, BOM), Co, Cn
    collapse_whitespace: true
  # Aggressive policy for hashing, dedup, ROUGE tokenization and fact matching only.
  matching:
    unicode_form: NFKC
    remove_tatweel: true
    diacritics: strip
    fold_persian_variants: true
    unify_alef: true
    alef_maqsura_to_yeh: true
    teh_marbuta_to_heh: true
    digits: ascii
    remove_control_chars: true
    collapse_whitespace: true
    remove_punctuation: true
    lowercase_latin: true

# ------------------------------------------------------- summarization pipeline (02)
pipeline:
  strategy: direct           # direct | segmentwise | hybrid | extractive | lead (direct: dev set + benchmark, PROGRESS 32-33)
  default_ratio: 0.20        # user-configurable at call time, clamped to [min_ratio, max_ratio]
  min_ratio: 0.10
  max_ratio: 0.30
  min_words: 30
  max_words: 300
  length_tolerance: 0.20     # acceptable +/- around the target (within the hard limits)
  chunking:                  # proposal §11.3
    max_tokens: 900
    overlap_tokens: 80
    paragraph_break_min_fill: 0.6
    special_tokens_reserve: 4
  segmentwise:
    segment_max_tokens: 320  # small segments -> about one XL-Sum-style sentence each
    min_segment_words: 12
  hybrid:
    extract_expansion: 1.6   # extract 1.6x the word budget, then rewrite
    position_weight: 0.3     # lead prior in TextRank scoring
    group_max_tokens: 320
  length_control:
    tokens_per_word: 1.6     # replaced by the per-model calibration from 02_preprocess
    min_factor: 0.8
    max_factor: 1.25
    # 05 (2026-10-18): 32/240 summaries too short, 0 too long; 16 ended mid-sentence at max_new_tokens.
    drop_unfinished: true    # cut a trailing fragment the token limit left in a model output
    fill: extractive         # none | extractive: top up a short model summary with uncovered source sentences
    fill_to: target          # lo (length rule only) | target: dev set 2026-10-18 (PROGRESS 29): R1 0.292 -> 0.307
    # dev set 2026-10-19 (PROGRESS 36), with the faithfulness filter: R1 0.367 -> 0.380
    fill_cover_threshold: 0.5  # a fill sentence is skipped if this share of its words is already in one summary sentence
    fill_skip_titles: true   # skip source lines without end punctuation (page titles) in the fill
    fill_number_bonus: 0.3   # TextRank score x (1 + bonus) for source sentences with a number
    # dev set 2026-10-19 (PROGRESS 37): R1 0.380 -> 0.380 (neutral), readability fixes from the 05 review
    fill_skip_questions: true  # skip rhetorical questions ("هل على معتادي السهر ...؟")
    fill_strip_leads: true   # remove datelines (first 3 sentences) and quoted crossheads at a sentence start
    fill_fix_quotes: true    # close / open a quote split across sentences when a speaker is named, else skip
  faithfulness:              # drop unfaithful model sentences, the fill replaces them (PROGRESS 35-36; summarize/faithful.py)
    enabled: true
    min_support: 0.8         # share of the claim's content stems found in its best support sentences
    max_support_sentences: 1 # 1: no fusing of facts from different source sentences (dev review: most errors)
    number_context: 0.4      # a number must occur in a source sentence sharing this share of the claim's stems
    negation: true
    quotes: 0.7              # share of a quoted span's word bigrams found in the source
    attribution: 0.5         # share of the speaker's words found near the claim's support sentences
    attribution_window: 3    # support sentence and the 3 before it (PROGRESS 37: 2 -> 3)
    attribution_name_match: true       # or: named in the latest nearby speaker phrase, described earlier
    attribution_latest_speaker: true   # reject if the latest speaker phrase before the claim names someone else
    attribution_single_source: true    # an attributed claim must come from one source sentence
  dedup_sentence_threshold: 0.7
  merge: none                # none | abstractive  (final abstractive re-summarization pass)

# Decoding defaults; tuned on validation in 03 and saved to a separate file (proposal §11.4).
decoding:
  num_beams: 4
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  early_stopping: true

# ------------------------------------------------------- fine-tuning (03)
finetune:
  max_source_tokens: 1024     # AraBART position limit; longer articles are truncated in training
  max_target_tokens: 128      # XL-Sum highlights: median ~24 words (~30 tokens)
  # Faithfulness filter for XL-Sum *train* pairs (eval.facts; 02 finding). Validation/test untouched.
  filter:
    require_numbers_supported: true   # every number in the highlight must occur in the article
    max_novel_rate: 0.35              # share of highlight content stems absent from the article
    min_keep_fraction: 0.5            # if fewer survive, the novel-rate threshold is relaxed (reported)
  train:                      # proposal §stage 4: seed 42, LR {1e-5,3e-5,5e-5}, <=5 epochs, eff. batch 16, patience 2
    seed: 42
    learning_rates: [1.0e-5, 3.0e-5, 5.0e-5]
    max_epochs: 5
    effective_batch_size: 16
    per_device_batch_size: 4   # x4 accumulation = 16; 1024-token batches fit a T4 in fp16
    eval_batch_size: 32
    patience: 2
    warmup: 0.05              # fraction of total steps
    weight_decay: 0.01
    label_smoothing: 0.0
    fp16: true
    eval_samples: 500         # fixed XL-Sum validation subset for per-epoch model selection
    eval_num_beams: 1         # greedy during training-time evaluation (cheap); beams tuned later
    grid_train_fraction: 0.25 # LR screening on a seeded 25 % of filtered train (T4 budget), final run on 100 %
    final_train_fraction: 1.0
    keep_checkpoints: false
    checkpoint_dir: /content/arabic_summ_checkpoints  # epoch checkpoints on Colab's local disk, not Drive
                              # (Drive quota); falls back to <run>/checkpoints if /content doesn't exist
    run_tag: r3               # bump when a fix invalidates earlier runs (r1: labels had no EOS; r2: eval metrics misordered; see PROGRESS)
  arat5v2:                    # single comparison run (decision 3)
    learning_rate: 5.0e-5
    fp16: false               # T5 overflows in fp16; T4 has no bf16
    per_device_batch_size: 2  # x8 accumulation = 16; batch 4 in fp32 ran out of the T4's 15 GB (2026-10-17)
    eval_batch_size: 8
    gradient_checkpointing: true
  style:                      # 03b: continue arabart_ft on multi-sentence summaries (PROGRESS 31)
    dataset:
      repo_id: oddadmix/arabic-news-summarization
      revision: fa8b5a62fb04e23ca757aca1bd143f71b2482084
      file: data/train-00000-of-00001.parquet
      text_col: origin_text_translated
      summary_col: summary_text_translated
      license: "not stated on the Hub; Arabic machine translation of CNN/DailyMail (research use)"
    min_source_words: 150
    max_source_words: 1100
    min_summary_words: 15
    min_arabic_ratio: 0.9
    filter:                   # same faithfulness filter as XL-Sum train (dry run: 17,862 -> 9,037 pairs, 0 leaked)
      require_numbers_supported: true
      max_novel_rate: 0.35
      min_keep_fraction: 0.5
    base_model: arabart_ft    # continue from the 03 model (models.<key>.local_path)
    learning_rate: 3.0e-5
    max_epochs: 3
    patience: 1
    run_tag: s1
    export_name: arabart_ft_style
  select:
    primary: rouge1
    faith_key: number_precision
    faith_tolerance: 0.02
  decoding_grid:              # tuned on a validation subset disjoint from eval_samples
    num_beams: [1, 2, 3, 4]
    length_penalty: [1.0, 1.5, 2.0]
    no_repeat_ngram_size: 3
    samples: 300
  export_name: arabart_ft

# ------------------------------------------------------- CPU optimization (04)
optimize:
  variants: [torch_fp32, torch_int8, onnx_fp32, onnx_int8]
  onnx_quant_arch: avx2        # target is an x86-64 8-core CPU; avx2 kernels run on any modern x86
  val_samples: 200             # XL-Sum validation articles for the FP32 vs INT8 ROUGE comparison
  bench_per_cell: 4            # benchmark texts per domain x length bin (24) for pipeline latency
  gates:                       # proposal: stage-1 requirements
    max_model_mb: 1024
    max_rss_mb: 8192
    max_median_seconds: 15
    max_rouge1_drop: 0.02      # vs torch_fp32
  weights: {quality: 0.5, time: 0.3, memory: 0.1, size: 0.1}   # proposal composite score
  source_model: arabart_ft_style   # model key to optimize (03b style model, PROGRESS 32; was arabart_ft)
  export_name: arabart_ft_style_cpu  # arabart_ft_cpu (03 model, 05 CPU half of 2026-10-18) stays on Drive

# ------------------------------------------------------- evaluation (05)
evaluate:
  approved_only: false        # true for the final report: only human-approved references count
  ft_model: arabart_ft_style      # fine-tuned model for the GPU systems (PROGRESS 32; was arabart_ft)
  primary_strategy: direct        # chosen on the dev set (PROGRESS 32), before any benchmark run of this model
  secondary_rouge_stem: snowball  # extra *_xlsum ROUGE columns (XL-Sum-style stemming); primary stays unstemmed (PROGRESS 30)
  ablation_strategies: [segmentwise, hybrid]
  acceptance:                 # proposal acceptance criteria
    min_rouge1: 0.40
    rouge1_metric: xlsum        # XL-Sum-style stemmed ROUGE-1 decides; strict still reported (project lead, 2026-10-20, PROGRESS 38)
    min_length_ok: 1.0
    max_median_s_300_700: 15
    max_median_s_all: 25
  human_eval:
    n_per_domain: 50          # >= 100 outputs, balanced across the two domains
    n_calibration: 20         # rater qualification: weighted kappa >= 0.7 vs reference rater
    min_calibration_kappa: 0.7
    kappa_weights: quadratic
    max_gap: 1                # larger disagreements go to a third rater
    min_mean: 4.0             # every criterion >= 4 (stricter reading of the proposal)
    max_critical_share: 0.2   # >= 80 % of items without critical errors
  bertscore_model: bert-base-multilingual-cased   # optional, if downloadable

# ------------------------------------------------------- models
models:
  arabart_ft:                 # produced by 03_finetune (relative local_path -> under paths.root)
    local_path: models/arabart_ft
    base: arabart
    license: "Apache-2.0 base; fine-tuned on XL-Sum (CC BY-NC-SA 4.0)"
    role: fine-tuned
  arabart_ft_style:           # produced by 03b_style_finetune (PROGRESS 31)
    local_path: models/arabart_ft_style
    base: arabart
    license: "Apache-2.0 base; XL-Sum (CC BY-NC-SA 4.0) + oddadmix/arabic-news-summarization (no license stated)"
    role: fine-tuned
  arabart:
    repo_id: moussaKam/AraBART
    revision: cb67d617b84f52755c0cbf34684a41fe0f01cdb1
    license: Apache-2.0
    role: primary
  arat5v2:
    repo_id: UBC-NLP/AraT5v2-base-1024
    revision: 3c74d91ba69456bf63c4657e37b0af39faecb26d
    license: "research use only; commercial use requires the authors' approval (no license field on the Hub)"
    role: comparison
  baselines:                  # public XL-Sum fine-tunes; derived from CC BY-NC-SA data
    arabart_xlsum_omar:
      repo_id: Omar10lfc/arabart-xlsum-arabic
      revision: c43dad77a8f6ac6319536f296bd0c260118a9efd
      license: "Apache-2.0 (model card); trained on XL-Sum CC BY-NC-SA 4.0"
    arabart_xlsum_kazed:
      repo_id: kazed/AraBART-finetuned-xlsum-arabic
      revision: f529516b9e01f06d13d133953ca2c30a13426fbb
      license: "not stated on the Hub"
    arat5v2_xlsum_ahmeddbahaa:
      repo_id: ahmeddbahaa/AraT5v2-base-1024-finetune-ar-xlsum
      revision: 05de0d3cbe1538ef661fbc544596c4f39d7fba52
      license: "not stated; base model research-only"
    arat5v2_xlsum_omarsabri:
      repo_id: omarsabri8756/AraT5v2-XLSum-arabic-text-summarization
      revision: b5e0b473a0d3b21735a92ff678e996e5e948bfa0
      license: "not stated; base model research-only"
